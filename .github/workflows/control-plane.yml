name: Control-plane checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install synthetic test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run offline regression tests (no live providers)
        run: python -m unittest discover -s tests -q
      - name: Verify shell failover and script syntax
        run: |
          bash tests/test_gigachat_failover.sh scripts/lib/gigachat_failover.sh "$(command -v python)"
          while IFS= read -r -d '' script; do
            bash -n "$script"
          done < <(find scripts -name '*.sh' -print0)
      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Reject tracked local environment and obvious credential assignments
        run: |
          test -z "$(git ls-files -- .env .env.* | grep -v '^\.env\.example$')"
          if git grep -nE '^(GIGACHAT_(KEY|CREDENTIALS)|POSTGRES_PASSWORD)=[^$[:space:]]+' -- ':!*.example'; then
            echo 'A credential assignment appears in a tracked file.' >&2
            exit 1
          fi
