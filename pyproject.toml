[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurolab"
version = "0.1.0"
description = "Исследовательский контур НейроЛаба: безопасные интеграции с LLM"
requires-python = ">=3.11"
dependencies = [
    "gigachat==0.2.3",
    "langgraph==1.2.11",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
start-directory = "tests"
